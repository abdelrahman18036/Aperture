name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://app:devpassword@localhost:5432/aperture
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT_URL: http://localhost:9000
  REALTIME_TICKET_SECRET: ci-only-ticket-secret

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: aperture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: apps/api
        run: uv sync --all-groups

      - name: Lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        working-directory: apps/api
        run: uv run mypy .

      - name: Migrations are complete
        working-directory: apps/api
        # A model change without a migration is a broken deploy, not a
        # runtime surprise. --check exits non-zero if one is missing.
        run: uv run manage.py makemigrations --check --dry-run

      - name: Test
        working-directory: apps/api
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo, not the root `pnpm lint`/`test`/`check-types` scripts.
      #
      # Those fan out across BOTH ecosystems, which is what you want on a
      # machine that has uv — one command, everything checked. This runner
      # does not have uv, and `@repo/api` is a shim whose scripts are
      # `uv run ruff` / `uv run mypy` / `uv run pytest`, so the root scripts
      # die on `uv: not found` before touching a line of TypeScript.
      #
      # Installing uv here would work and would also re-run, more slowly,
      # exactly what the `backend` job above already ran. The jobs own one
      # ecosystem each; this filter is what says so.
      - run: pnpm exec turbo run lint --filter='!@repo/api'

      - run: pnpm exec turbo run check-types --filter='!@repo/api'

      - run: pnpm exec turbo run test --filter='!@repo/api'

      - run: pnpm exec turbo run build --filter='!@repo/api'

  api-client-drift:
    # The seam the Django choice costs us. A serializer change that is not
    # reflected in a regenerated client fails here rather than at runtime --
    # 01-ARCHITECTURE.md §3 calls this the whole point, so it gets its own job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install backend
        working-directory: apps/api
        run: uv sync --all-groups

      - name: Regenerate and fail on any diff
        run: pnpm verify:api-client
