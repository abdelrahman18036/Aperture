# Aperture's local environment.
#
# Every service here speaks the same protocol as its production replacement:
# MinIO is S3's API so Cloudflare R2 is an env var, self-hosted LiveKit is
# LiveKit Cloud's API, Postgres is Postgres. You never rewrite to scale — you
# swap the endpoint. See 01-ARCHITECTURE.md §4.
#
# Image tags are concrete, never `latest`: a compose file that pulls a
# floating tag is not reproducible. Pins are verified in docs/VERSIONS.md.
#
# Docker Desktop does not auto-start on this machine. Start it first.

name: aperture

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: aperture
    # Host 5432 is held by a native postgresql-x64-17 Windows service that has
    # nothing to do with this project, so the container binds 5433. Inside
    # this network everything still talks to postgres:5432.
    ports: ["5433:5432"]
    # 01-ARCHITECTURE.md §4 mounts this at /var/lib/postgresql/data, which is
    # the pre-18 convention. The postgres:18+ images refuse to start against
    # that path: they store data in a major-version subdirectory so that
    # `pg_upgrade --link` does not cross a mount boundary. Mount the parent.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s

  redis:
    image: redis:8-alpine
    # Celery broker, feed cache, and the pub/sub bus between Django and the
    # realtime gateway — all three.
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s

  minio-init:
    image: minio/mc
    # §4 says `depends_on: [minio]`, which only waits for the container to
    # start, not to be listening — so every bucket creation raced ahead and
    # failed with connection refused. Gate on the healthcheck instead.
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/media;
      mc mb --ignore-existing local/dm-media;
      mc anonymous set download local/media;
      "

  typesense:
    image: typesense/typesense:28.0
    environment:
      TYPESENSE_API_KEY: devkey
      TYPESENSE_DATA_DIR: /data
    ports: ["8108:8108"]
    volumes: [typesensedata:/data]

  # ---------------------------------------------------------------------
  # Calls — Phase 7. Behind a profile so the everyday `docker compose up`
  # brings up only what Phases 1-6 need:  docker compose --profile calls up
  # ---------------------------------------------------------------------

  livekit:
    image: livekit/livekit-server:v1.13.5
    profiles: ["calls"]
    command: --config /etc/livekit.yaml --node-ip=127.0.0.1
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    volumes: [./livekit/livekit.yaml:/etc/livekit.yaml]

  coturn:
    image: coturn/coturn:4.17.2
    profiles: ["calls"]
    # 01-ARCHITECTURE.md §4 uses `network_mode: host`, which is right on Linux
    # and does nothing useful here: on Docker Desktop for Windows "host" is the
    # Linux VM's network namespace, not Windows'. coturn came up happily and
    # was unreachable from the browser — nothing listening on 127.0.0.1:443.
    #
    # Published ports instead, which forces two things a host-networked relay
    # gets for free:
    #
    #   `--external-ip` — a relay hands out the address it expects to be dialled
    #   on. Behind a NAT it would otherwise advertise its bridge IP, and every
    #   relayed candidate would be dead on arrival.
    #
    #   a narrow relay port range — allocations come from `min-port..max-port`,
    #   and every one of those has to be published. The default range is 16k
    #   ports; 50 is plenty for development and the rest is not worth the
    #   startup cost.
    ports:
      # STUN/TURN, both transports.
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # The one that matters: TLS on 443, indistinguishable from HTTPS to a
      # firewall that drops UDP. §9 calls this non-negotiable.
      - "443:443/tcp"
      # Relay allocations.
      - "50200-50250:50200-50250/udp"
    # The secret is passed here rather than written into turnserver.conf —
    # rule 12. It must match Django's TURN_STATIC_AUTH_SECRET or every
    # credential Django mints is rejected, and the symptom is not an error but
    # a call that works at home and fails behind a firewall.
    #
    # The last two flags are **development only**, and both are consequences of
    # publishing ports instead of using host networking:
    #
    #   `--allow-loopback-peers` — two browsers on one machine both get relay
    #   candidates on 127.0.0.1, so without this every permission between them
    #   is refused and the relay allocates happily then carries nothing.
    #
    #   `--allowed-peer-ip` for the bridge range — traffic from Windows reaches
    #   the container through Docker's NAT, so coturn sees the *bridge* address
    #   as the peer and the anti-open-proxy rule in turnserver.conf denies it.
    #   That rule is right in production, where peers are public addresses;
    #   here it is denying an artifact of the workaround.
    #
    # Neither belongs in turnserver.conf, which stays production-shaped.
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-dev-only-insecure-turn-secret-0123456789abcdef}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --min-port=50200
      --max-port=50250
      --allow-loopback-peers
      --allowed-peer-ip=172.16.0.0-172.31.255.255
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # Generated locally, never committed. See turnserver.conf for the
      # one-line openssl command that makes them.
      - ./coturn/certs:/etc/coturn/certs:ro

# 01-ARCHITECTURE.md §4 writes this as `{ pgdata:, redisdata:, ... }`, which
# YAML flow syntax rejects — a flow mapping needs a space after each colon, so
# `pgdata:` parses as a scalar rather than a key. Block style instead.
volumes:
  pgdata:
  redisdata:
  miniodata:
  typesensedata:

