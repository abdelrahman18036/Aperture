# coturn — TURN relay for WebRTC.
#
# The line that matters is `tls-listening-port=443`. Egyptian ISPs and
# effectively every corporate firewall drop UDP; without a TCP/443 fallback
# the call connection rate quietly sits near 70% and the code gets blamed.
# Non-negotiable, per 01-ARCHITECTURE.md §9.
#
# Phase 7 wires this up. It is here now so the compose file is complete, and
# it sits behind the `calls` profile until then.
#
# Budget relayed bandwidth as a real line item: every relayed call is full
# media through this server, and it is the one WebRTC cost that scales
# linearly with usage.

listening-port=3478
tls-listening-port=443

# Development credentials. Production uses the long-term credential mechanism
# with per-user secrets minted by Django, never a static password.
lt-cred-mech
user=aperture:devpassword
realm=aperture.local

fingerprint

# Phase 7 supplies real certificates. Without these the TLS listener does not
# come up, which is exactly the path that needs testing — see the phase's
# verification step, which forces iceTransportPolicy: 'relay'.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Do not relay to private ranges: an open TURN server is an open proxy.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

no-cli
log-file=stdout
