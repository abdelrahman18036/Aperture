# coturn — TURN relay for WebRTC.
#
# The line that matters is `tls-listening-port=443`. Egyptian ISPs and
# effectively every corporate firewall drop UDP; without a TCP/443 fallback
# the call connection rate quietly sits near 70% and the code gets blamed.
# Non-negotiable, per 01-ARCHITECTURE.md §9.
#
# Budget relayed bandwidth as a real line item: every relayed call is full
# media through this server, and it is the one WebRTC cost that scales
# linearly with usage.

listening-port=3478
tls-listening-port=443

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
#
# `use-auth-secret`, not a user list. Django mints a credential that expires:
#
#     username = "<unix-expiry>:<user-id>"
#     password = base64(HMAC-SHA1(static-auth-secret, username))
#
# coturn recomputes the same HMAC from its own copy of the secret and
# compares. No per-user rows here, no revocation list, nothing to keep in sync
# — the credential simply stops working. `apps/api/core/turn.py` is the other
# half of this, and its tests assert the digest by hand so the two cannot
# drift apart silently.
#
# **The secret is not in this file.** It arrives as `--static-auth-secret` on
# the command line from `TURN_STATIC_AUTH_SECRET` in the environment, the same
# way `REALTIME_TICKET_SECRET` is shared with the gateway — rule 12.

use-auth-secret
realm=aperture.local

fingerprint

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
#
# Generated locally and never committed — `infra/coturn/certs/` is ignored:
#
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout infra/coturn/certs/privkey.pem \
#     -out infra/coturn/certs/fullchain.pem \
#     -days 825 -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#
# Self-signed is fine here and only here. A browser does not validate a
# `turns:` certificate against a hostname the way it does for HTTPS — TLS on
# 443 is doing a different job, which is looking like ordinary HTTPS to
# whatever sits between the client and the relay. Production uses a real
# certificate for the host clients actually dial.

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Do not relay to private ranges: an open TURN server is an open proxy.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

no-cli
log-file=stdout
