# coturn — TURN relay for WebRTC.
#
# The line that matters is `tls-listening-port=443`. Egyptian ISPs and
# effectively every corporate firewall drop UDP; without a TCP/443 fallback
# the call connection rate quietly sits near 70% and the code gets blamed.
# Non-negotiable, per 01-ARCHITECTURE.md §9.
#
# Budget relayed bandwidth as a real line item: every relayed call is full
# media through this server, and it is the one WebRTC cost that scales
# linearly with usage.

listening-port=3478
tls-listening-port=443

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
#
# `use-auth-secret`, not a user list. Django mints a credential that expires:
#
#     username = "<unix-expiry>:<user-id>"
#     password = base64(HMAC-SHA1(static-auth-secret, username))
#
# coturn recomputes the same HMAC from its own copy of the secret and
# compares. No per-user rows here, no revocation list, nothing to keep in sync
# — the credential simply stops working. `apps/api/core/turn.py` is the other
# half of this, and its tests assert the digest by hand so the two cannot
# drift apart silently.
#
# **The secret is not in this file.** It arrives as `--static-auth-secret` on
# the command line from `TURN_STATIC_AUTH_SECRET` in the environment, the same
# way `REALTIME_TICKET_SECRET` is shared with the gateway — rule 12.

use-auth-secret
realm=aperture.local

fingerprint

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
#
# Generated locally and never committed — `infra/coturn/certs/` is ignored.
# `mkcert` issues one covering every name a browser might dial:
#
#   mkcert -cert-file infra/coturn/certs/fullchain.pem \
#          -key-file  infra/coturn/certs/privkey.pem \
#          localhost 127.0.0.1 ::1
#
# Without mkcert, openssl is enough to start the listener and not enough to
# use it from a browser:
#
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout infra/coturn/certs/privkey.pem \
#     -out infra/coturn/certs/fullchain.pem \
#     -days 825 -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#
# **Chrome validates a `turns:` certificate exactly as it does for HTTPS.** It
# rejects an untrusted one before any TURN message is sent:
# `onicecandidateerror` reports code 701, "Failed to establish connection",
# with no address. Nothing in coturn's log mentions it, because from its side
# no connection ever arrived.
#
# Measured on this machine, so nobody has to rediscover it:
#
#   openssl s_client -connect 127.0.0.1:443    → TLS 1.3, handshake fine
#   ... -CAfile "$(mkcert -CAROOT)/rootCA.pem" → Verification: OK
#   turnutils_uclient -t -S -p 443 …           → allocation succeeds, the
#                                                credential accepted over TLS
#   Chrome, turns: only, relay policy          → 0 candidates, error 701
#
# So the chain is complete and the 443 path is sound; what is missing is the
# machine trusting the CA that signed it. One command closes that:
#
#   mkcert -install
#
# then restart the browser and place a call with `?relay=1`. The selected pair
# should report `relayProtocol: "tls"` and a `turns:` url rather than the
# `turn:` one it reports today.
#
# **Know what that command does before running it.** It writes a new root CA
# into the machine's trust store, so anything signed by that CA is trusted by
# your browser from then on — including by anyone who obtains the key sitting
# in `$(mkcert -CAROOT)`. A normal trade on a development machine, and a
# decision for whoever owns the machine rather than something a setup step
# should do quietly. Nothing else in this project needs it: every other path,
# relayed media over UDP included, already works without it.
#
# mkcert's own output misleads here — issuing a certificate warns only about
# the *Java* trust store, which reads as though the system store were handled.
# It is not; `Get-ChildItem Cert:\CurrentUser\Root` and `LocalMachine\Root`
# both come back empty until you run the command above.

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Do not relay to private ranges: an open TURN server is an open proxy.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

no-cli
log-file=stdout
